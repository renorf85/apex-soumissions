<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Apex Soumissions - Maintenance</title>
    <link rel="icon" type="image/png" href="assets/favicon.png" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
        }
        .container {
            text-align: center;
            max-width: 480px;
        }
        .logo {
            width: 120px;
            margin-bottom: 2.5rem;
            opacity: 0.9;
        }
        .icon {
            font-size: 3rem;
            margin-bottom: 1.5rem;
            opacity: 0.6;
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: #f8fafc;
        }
        p {
            font-size: 1rem;
            line-height: 1.6;
            color: #94a3b8;
            margin-bottom: 2rem;
        }
        .contact {
            font-size: 0.875rem;
            color: #64748b;
        }
        .contact a {
            color: #60a5fa;
            text-decoration: none;
        }
        .contact a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="assets/logo-apex-full.png" alt="Apex" class="logo" />
        <div class="icon">&#128736;</div>
        <h1>Application en maintenance</h1>
        <p>Le service est temporairement suspendu. Veuillez contacter l'administrateur pour plus d'informations.</p>
        <div class="contact">
            <a href="mailto:contact@actionflow.ca">contact@actionflow.ca</a>
        </div>
    </div>
</body>
</html>
